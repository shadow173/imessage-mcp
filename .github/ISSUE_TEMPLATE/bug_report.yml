name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real message content, names, phone numbers, emails, tokens or secrets here.** Issues are public.
        Describe the problem with made-up examples, and redact logs and tool output before pasting them.
        Security problems go through private reporting instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or tool calls, with made-up names and numbers. Mock mode reproductions are ideal.
      placeholder: |
        1. DEV=1 npm run dev
        2. Call search_messages with query "dinner" from "Sam"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Setup
      options:
        - Local only (bridge without a gateway, CLI or imessage mcp)
        - Gateway relaying to the bridge
        - Mock mode
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      multiple: true
      options:
        - ChatGPT
        - Claude (web, desktop or mobile)
        - Claude Code
        - imessage CLI
        - Other MCP client
    validations:
      required: true
  - type: dropdown
    id: private-api
    attributes:
      label: Private API tier
      options:
        - "Off"
        - "On (PRIVATE_API=imsg)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.20.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: imessage-mcp version or commit
      placeholder: 0.2.0 or a commit hash
  - type: textarea
    id: status
    attributes:
      label: get_status output (redacted)
      description: From `imessage status --intent "Bug report"` or the get_status tool. Remove your name, numbers and emails.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      description: From ~/Library/Logs/imessage-mcp/bridge.log or the gateway's logs. Remove anything personal.
      render: text
